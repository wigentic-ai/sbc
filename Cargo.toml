[package]
name = "sbc"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Connect to Docker Sandboxes locally or over SSH"
license = "MIT"
repository = "https://github.com/wigentic-ai/sbc"
homepage = "https://github.com/wigentic-ai/sbc"
readme = "README.md"
keywords = ["docker", "sandbox", "ssh", "clipboard", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
arboard = "3.6.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
crossterm = "0.29.0"
ctrlc = "3.5.2"
directories = "6.0.0"
png = "0.18.1"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
toml = "1.1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
