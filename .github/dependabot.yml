version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # cargo-dist 0.32 generates checkout@v6 and rejects workflow drift.
    ignore:
      - dependency-name: actions/checkout
        update-types:
          - version-update:semver-major
